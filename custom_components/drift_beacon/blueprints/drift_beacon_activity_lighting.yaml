blueprint:
  name: Drift Beacon Activity Lighting
  description: >
    Colour lights after what you are doing in Drift Beacon: bright in the activity's colour
    while a session is live, dim in the pinned activity's colour when something is pinned, and
    off otherwise. Resyncs when Home Assistant starts and after reconnecting.
  domain: automation
  homeassistant:
    min_version: "2026.9.0"
  source_url: https://github.com/drift-beacon/ha-integration/blob/main/custom_components/drift_beacon/blueprints/drift_beacon_activity_lighting.yaml

  input:
    workspace:
      name: Workspace
      description: The Drift Beacon workspace whose activity controls these lights.
      selector:
        device:
          filter:
            - integration: drift_beacon
              model: Workspace

    target_lights:
      name: Lights
      description: The lights or light groups to control.
      selector:
        target:
          entity:
            - domain: light

    session_brightness:
      name: Session brightness
      description: Brightness while a session is live.
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider

    pinned_brightness:
      name: Pinned brightness
      description: Brightness when an activity is pinned and no session is live.
      default: 5
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider

    transition:
      name: Transition
      description: Seconds to fade between colours.
      default: 0
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: "s"
          mode: slider

    off_transition:
      name: Turn-off transition
      description: Seconds to fade out when nothing is live or pinned.
      default: 0
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: "s"
          mode: slider

    disable_when:
      name: Disable when (optional)
      description: Leave the lights alone while these conditions hold. Leave empty to always run.
      default: []
      selector:
        condition:

mode: restart
max_exceeded: silent

triggers:
  - trigger: event
    event_type: drift_beacon_focus_changed
    event_data:
      workspace_device_id: !input workspace

conditions:
  # `not` over an empty list holds, so leaving the input empty never blocks the lights.
  - condition: not
    conditions: !input disable_when

actions:
  - variables:
      color: "{{ trigger.event.data.color }}"
  - choose:
      - conditions: "{{ trigger.event.data.state == 'live' and color is not none }}"
        sequence:
          - action: light.turn_on
            target: !input target_lights
            data:
              rgb_color: "{{ color }}"
              brightness_pct: !input session_brightness
              transition: !input transition
      - conditions: "{{ trigger.event.data.state == 'pinned' and color is not none }}"
        sequence:
          - action: light.turn_on
            target: !input target_lights
            data:
              rgb_color: "{{ color }}"
              brightness_pct: !input pinned_brightness
              transition: !input transition
    default:
      - action: light.turn_off
        target: !input target_lights
        data:
          transition: !input off_transition
